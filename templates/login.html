<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign in</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #fff5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #4a1d2a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            background: #fff;
            border-radius: 0.9rem;
            padding: 2rem 1.75rem;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 6px 24px rgba(224, 36, 94, 0.18);
        }
        h1 {
            margin: 0 0 1.25rem;
            color: #e0245e;
            font-size: 1.5rem;
            text-align: center;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #7a3a4d;
            margin: 0.75rem 0 0.35rem;
        }
        input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #f4cdd7;
            border-radius: 0.5rem;
            font-size: 1rem;
            color: #4a1d2a;
            background: #fff;
        }
        input:focus {
            outline: none;
            border-color: #e0245e;
            box-shadow: 0 0 0 3px rgba(224, 36, 94, 0.15);
        }
        button {
            margin-top: 1.25rem;
            width: 100%;
            padding: 0.7rem;
            background: #e0245e;
            color: #fff;
            border: 0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #c41f52; }
        .error {
            margin-top: 1rem;
            padding: 0.6rem 0.75rem;
            background: #ffe5ec;
            border: 1px solid #f4cdd7;
            border-radius: 0.5rem;
            color: #b51844;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <form class="card" method="post" autocomplete="off">
        <h1>Sign in</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
